name: CI

on:
  push:
    branches: [main]
  pull_request:

# sem depends on its siblings (@tangent.to/grad, lina, opt, proba) through
# published semver ranges, not file:../ specifiers, so npm install resolves
# them from the registry and no sibling checkout is needed.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sem
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and test sem
        run: |
          npm install --no-fund --no-audit
          npm run test:run
        working-directory: sem

  reference:
    name: compare against lavaan (semopy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sem
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: npm install --no-fund --no-audit
        working-directory: sem
      - run: npm run test:semopy
        working-directory: sem
